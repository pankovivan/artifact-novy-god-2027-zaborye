<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="sledTitle sledDesc">
  <title id="sledTitle">Снегоход в зимнем лесу</title>
  <desc id="sledDesc">Человек в шлеме едет на снегоходе по заснеженному лесу, фара освещает снег.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset=".58" stop-color="#0d2740"/>
      <stop offset="1" stop-color="#17435b"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff4d6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset=".55" stop-color="#dbe8f8"/>
      <stop offset="1" stop-color="#bcd1e8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0917d"/>
      <stop offset="1" stop-color="#c9554b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
