<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="banyaTitle banyaDesc">
  <title id="banyaTitle">Деревенская баня зимой</title>
  <desc id="banyaDesc">Бревенчатая баня с тёплым светом, паром, купелью, веником и ведром снега.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset=".6" stop-color="#0e2a43"/>
      <stop offset="1" stop-color="#184860"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff4d6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f6ff"/>
      <stop offset=".55" stop-color="#dbe8f8"/>
      <stop offset="1" stop-color="#bcd1e8"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#453128"/>
      <stop offset="1" stop-color="#2c1e18"/>
